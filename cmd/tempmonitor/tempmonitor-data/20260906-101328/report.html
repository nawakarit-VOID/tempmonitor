function drawLineChart(canvas, spec) {
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const padL = 54, padR = 20, padT = 34, padB = 40;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  const x = spec.x;
  if (!x || x.length < 2) {
    ctx.fillStyle = "#888";
    ctx.font = "14px sans-serif";
    ctx.fillText("Not enough data to chart", padL, H / 2);
    return;
  }

  const xMin = x[0], xMax = x[x.length - 1];

  let yMin = spec.yMin, yMax = spec.yMax;
  if (yMin === undefined || yMax === undefined) {
    let lo = Infinity, hi = -Infinity;
    for (const s of spec.series) {
      for (const v of s.values) {
        if (v === null || v === undefined) continue;
        if (v < lo) lo = v;
        if (v > hi) hi = v;
      }
    }
    if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
    if (lo === hi) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.1;
    yMin = lo - pad;
    yMax = hi + pad;
  }

  function xToPx(v) {
    return padL + (v - xMin) / ((xMax - xMin) || 1) * plotW;
  }
  function yToPx(v) {
    return padT + (1 - (v - yMin) / ((yMax - yMin) || 1)) * plotH;
  }

  ctx.strokeStyle = "#444";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, padT + plotH);
  ctx.lineTo(padL + plotW, padT + plotH);
  ctx.stroke();

  ctx.font = "11px sans-serif";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  const yTicks = 5;
  for (let i = 0; i <= yTicks; i++) {
    const v = yMin + (yMax - yMin) * i / yTicks;
    const py = yToPx(v);
    ctx.strokeStyle = "#26272b";
    ctx.beginPath();
    ctx.moveTo(padL, py);
    ctx.lineTo(padL + plotW, py);
    ctx.stroke();
    ctx.fillStyle = "#9a9a9a";
    ctx.fillText(v.toFixed(1), padL - 8, py);
  }

  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  const xTicks = 6;
  for (let i = 0; i <= xTicks; i++) {
    const v = xMin + (xMax - xMin) * i / xTicks;
    const px = xToPx(v);
    ctx.fillStyle = "#9a9a9a";
    ctx.fillText(v.toFixed(0) + "s", px, padT + plotH + 8);
  }

  for (const s of spec.series) {
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    let started = false;
    for (let i = 0; i < x.length; i++) {
      const v = s.values[i];
      if (v === null || v === undefined) {
        started = false;
        continue;
      }
      const px = xToPx(x[i]);
      const py = yToPx(v);
      if (!started) {
        ctx.moveTo(px, py);
        started = true;
      } else {
        ctx.lineTo(px, py);
      }
    }
    ctx.stroke();
  }

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillText(spec.title, padL, 20);
}

function buildLegend(container, series) {
  container.innerHTML = "";
  for (const s of series) {
    const item = document.createElement("span");
    item.className = "legend-item";
    const swatch = document.createElement("span");
    swatch.className = "legend-swatch";
    swatch.style.backgroundColor = s.color;
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(s.label));
    container.appendChild(item);
  }
}
